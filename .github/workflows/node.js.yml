name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install
    - run: npm test -- --run
    - run: npm run build
      env:
        VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    - name: Build staging variant into dist/staging
      env:
        VITE_GAS_ENDPOINT: "https://script.google.com/macros/s/AKfycbxnOtsPnn7_DXU-WsgKCxSlFcOvK0xO0IoTx1i3gNkMNMQ8duaMa0fyeSW_dDaZE3pv/exec"
        VITE_STAGING: "1"
        VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      run: |
        npm run build:staging
        mkdir -p dist/staging
        cp -r dist-staging/* dist/staging/
    - name: Generate OGP Image from GAS JSON
      run: |
        # URL-encoded title: 健康可視化
        JSON_RESPONSE=$(curl -L -s "https://script.google.com/macros/s/AKfycbzbMAKxkzHlwN8SY7ygJA34xYESMNNdkGNt8vv1XMcZSksgHsUwOxCCdP-wgg6fv7M/exec?t=%E5%81%A5%E5%BA%B7%E5%8F%AF%E8%A6%96%E5%8C%96")
        echo $JSON_RESPONSE | jq -r '.png' | base64 -d > ./dist/ogp.png
        ls -lh ./dist/ogp.png
    - name: Deploy to GitHub Pages
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist

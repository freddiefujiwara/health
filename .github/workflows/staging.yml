name: Deploy Staging Preview

on:
  push:
    branches-ignore: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - run: npm install
    - run: npm test

    - name: Build staging variant
      env:
        VITE_GAS_ENDPOINT: "https://script.google.com/macros/s/AKfycbxnOtsPnn7_DXU-WsgKCxSlFcOvK0xO0IoTx1i3gNkMNMQ8duaMa0fyeSW_dDaZE3pv/exec"
        VITE_STAGING: "1"
        VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      run: npm run build:staging

    - name: Deploy staging to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist-staging
        destination_dir: staging
        keep_files: true

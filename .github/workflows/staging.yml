name: Deploy Staging Preview

on:
  push:
    branches-ignore: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - run: npm install
    - run: npm test

    - name: Build staging variant
      env:
        VITE_GAS_ENDPOINT: "https://script.google.com/macros/s/AKfycbxnOtsPnn7_DXU-WsgKCxSlFcOvK0xO0IoTx1i3gNkMNMQ8duaMa0fyeSW_dDaZE3pv/exec"
        VITE_STAGING: "1"
        VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      run: npm run build:staging

    - name: Deploy staging to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist-staging
        destination_dir: staging
        keep_files: true

  e2e:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Wait for the preview to be published
        run: sleep 60
      - name: Check the staging preview in a real browser
        env:
          HOME: /root
          APP: health
        run: npx playwright test e2e/staging.check.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
